name: Deploy Athar Garment Studio App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Assets Safely
        run: |
          echo "Locating and bundling Athar Garment Studio files..."
          mkdir -p dist
          # Find and copy html, css, js wherever they are in root
          find . -maxdepth 3 -name "*.html" -exec cp {} dist/ \;
          find . -maxdepth 3 -name "*.css" -exec cp {} dist/ \;
          find . -maxdepth 3 -name "*.js" -exec cp {} dist/ \;
          ls -la dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
